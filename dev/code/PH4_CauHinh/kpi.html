<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình KPI Lead time — ViettelAIWS</title>
  <link rel="stylesheet" href="kpi.css">
</head>

<body>

  <div class="app-container" id="kpi-app">
    <div class="view-panel active">

      <!-- HEADER -->
      <div class="page-header">
        <div>
          <h1>Cấu hình KPI Lead time</h1>
        </div>
        <div style="display: flex; gap: 8px;">
          <!-- Normal Mode Buttons -->
          <button class="btn btn-primary" id="btn-edit" onclick="enterEditMode()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              style="width:14px;height:14px;">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
            Sửa cấu hình
          </button>

          <!-- Edit Mode Buttons (Hidden by default) -->
          <button class="btn btn-ghost" id="btn-cancel" onclick="exitEditMode(false)" style="display: none;">
            Hủy bỏ
          </button>
          <button class="btn btn-primary" id="btn-save" onclick="openConfirmModal()"
            style="display: none; background: var(--success); border-color: var(--success);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              style="width:14px;height:14px;">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            Lưu cấu hình
          </button>
        </div>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-row">
        <div class="filter-group" style="flex: 1;">
          <label class="filter-label">Tìm kiếm Task</label>
          <input type="text" id="search-input" class="form-control" placeholder="Tìm theo mã hoặc tên task..."
            oninput="handleSearch()">
        </div>
        <div class="filter-group" style="width: 200px;">
          <label class="filter-label">Quy trình nghiệp vụ</label>
          <select id="filter-process" class="form-control" onchange="handleSearch()">
            <option value="">Tất cả quy trình</option>
            <option value="Nhập kho">Nhập kho (Inbound)</option>
            <option value="Xuất kho">Xuất kho (Outbound)</option>
          </select>
        </div>
        <div class="filter-group" style="justify-content: flex-end;">
          <button class="btn btn-ghost" style="height:36px;" onclick="resetFilters()">
            Xóa bộ lọc
          </button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 60px;">STT</th>
              <th style="width: 140px;">Mã Task</th>
              <th>Tên Task</th>
              <th style="width: 150px;">Quy trình</th>
              <th style="width: 180px;">Role thực hiện</th>
              <th style="width: 160px;">KPI</th>
              <th style="width: 180px;">Task tiền đề</th>
             
            </tr>
          </thead>
          <tbody id="kpi-tbody">
            <!-- Dynamic rows will be inserted here -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <div class="modal-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <h3>Xác nhận lưu cấu hình</h3>
      </div>
      <div class="modal-body">
        Bạn có chắc chắn muốn lưu toàn bộ các thay đổi về KPI của các Task trong cấu hình KPI
        không?
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeConfirmModal()">Hủy bỏ</button>
        <button class="btn btn-primary" onclick="submitSave()" style="background: var(--primary2);">Xác nhận
          lưu</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFIER -->
  <div class="toast-container" id="toast-container"></div>

  <script src="kpi.js"></script>
</body>

</html>
